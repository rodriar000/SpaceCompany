name: CI

# Verification only — this workflow never deploys, publishes, or touches
# gh-pages. It runs on pull requests and on pushes to the dev integration
# branch.
on:
  pull_request:
  push:
    branches: [dev]

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Use the Node version declared by the repository (.nvmrc = 18).
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Verify (lint + deterministic build + tests)
        run: npm run verify
